<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Toets Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📚 Toets Maker</h1>

<div class="container">

    <h2>➕ Vraag toevoegen</h2>

    <input id="vraagInput" placeholder="Typ je vraag...">

    <input id="antwoord1" placeholder="Antwoord 1">
    <input id="antwoord2" placeholder="Antwoord 2">
    <input id="antwoord3" placeholder="Antwoord 3">
    <input id="antwoord4" placeholder="Antwoord 4">

    <p>Juiste antwoord (1-4):</p>
    <input type="number" id="juisteAntwoord" min="1" max="4">

    <button onclick="addQuestion()">Toevoegen</button>

    <hr>

    <h2>🎮 Start Toets</h2>
    <button onclick="startQuiz()">Start</button>

    <hr>

    <p>Hoe zwaar telt de toets?</p>
    <input type="number" id="weight" value="1">

    <div id="quiz"></div>
    <div id="result"></div>

</div>

<script src="script.js"></script>
</body>
</html>
